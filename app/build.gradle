apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.greenrobot.greendao'
apply plugin: "de.timfreiheit.resourceplaceholders"

static def releaseTime() {
    return new Date().format("yy.MMddHH", TimeZone.getTimeZone("GMT+8"))
}

def name = "YueDu"
def version = "2." + releaseTime()
// 原版用 git rev-list 计算 commit 数；从 zip 解压的源码没有 .git，改为固定值
def gitCommits = 5982

android {
    compileSdkVersion 29
    buildToolsVersion '28.0.3'

    defaultConfig {
        applicationId "com.gedoor.monkeybook"
        minSdkVersion 19
        targetSdkVersion 29
        versionCode 10000 + gitCommits
        versionName version
        project.ext.set("archivesBaseName", name + "_" + version)
        multiDexEnabled true
        testInstrumentationRunner 'com.kunfei.bookshelf.compat.CompatibilityInstrumentation'

    }
    buildFeatures {
        viewBinding true
    }
    testBuildType 'release'
    testOptions { unitTests.returnDefaultValues = true }
    lintOptions {
        abortOnError false
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix 'debug'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        android.applicationVariants.all { variant ->
            variant.outputs.all {
                outputFileName = "${name}_${defaultConfig.versionName}.apk"
            }
        }
    }
    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true
        // Sets Java compatibility to Java 8
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

resourcePlaceholders {
    files = ['xml/shortcuts.xml']
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.1'
    testImplementation 'junit:junit:4.13.1'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':basemvplib')

    api 'androidx.core:core-ktx:1.3.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    //anko
    def anko_version = '0.10.8'
    implementation "org.jetbrains.anko:anko-sdk27:$anko_version"
    implementation "org.jetbrains.anko:anko-sdk27-listeners:$anko_version"

    //fireBase 已移除（本项目离线构建，且 google-services.json 缺失会阻断编译）

    //androidX
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.media:media:1.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    //google
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.google.android:flexbox:1.1.0'

    //RxAndroid
    implementation 'io.reactivex.rxjava2:rxjava:2.2.19'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    //RxBus
    implementation 'com.hwangjr.rxbus:rxbus:2.0.1'

    //Retrofit —— 关键改动：降到 2.6.4 并强制 OkHttp 3.12.13
    //  原版 Retrofit 2.9.0 传递依赖 OkHttp 3.14.9，而 OkHttp 3.13+ 要求 API 21，
    //  在 Android 4.4(API 19) 上会抛 IllegalStateException: Expected Android API level 21+
    //  OkHttp 3.12.13 是最后一个支持 API 9+ 的版本
    //noinspection GradleDependency
    implementation('com.squareup.retrofit2:retrofit:2.6.4') {
        exclude group: 'com.squareup.okhttp3'
    }
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.6.4'
    implementation 'com.squareup.retrofit2:converter-scalars:2.6.4'
    //noinspection GradleDependency
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    //noinspection GradleDependency
    implementation 'com.squareup.okhttp3:logging-interceptor:3.12.13'
    //noinspection GradleDependency
    implementation 'com.squareup.okio:okio:1.15.0'

    //J_SOUP
    implementation 'org.jsoup:jsoup:1.13.1'
    implementation 'cn.wanghaomiao:JsoupXpath:2.3.2'
    implementation 'com.jayway.jsonpath:json-path:2.4.0'

    //JS —— 关键改动：1.3 → 1.8
    //  新格式书源大量使用现代 JS 语法（箭头函数、模板字符串、let/const 等），
    //  内置的 Rhino 1.3 会直接报 "missing ; before statement"。
    //  1.8 内置的是较新的 Rhino，支持 ES6 语法。
    //noinspection GradleDependency
    implementation 'org.mozilla:rhino:1.7.15'

    //GreenDao
    implementation 'org.greenrobot:greendao:3.3.0'
    implementation 'com.github.yuweiguocn:GreenDaoUpgradeHelper:v2.2.1'

    //Glide
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'

    //CircleImageView
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    //webServer
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.nanohttpd:nanohttpd-websocket:2.3.1'

    //二维码
    implementation 'cn.bingoogolapple:bga-qrcode-zxing:1.3.7'

    //颜色选择
    implementation 'com.jaredrummler:colorpicker:1.1.0'

    //简繁转换
    implementation 'com.luhuiguo:chinese-utils:1.0'

    //字符串比较
    implementation 'net.ricecode:string-similarity:1.0.0'

    //MarkDown
    implementation 'ru.noties.markwon:core:3.1.0'

    //TLS —— 关键改动
    //  Android 4.4 自带的 OpenSSL 协议栈太老，与要求 TLS1.2 的现代站点握手会失败
    //  （tlsv1 alert protocol version / ssl3 alert handshake failure / unsupported protocol）。
    //  Conscrypt 提供一套自带原生实现的现代 TLS，替换掉平台 SSL 栈。
    implementation 'org.conscrypt:conscrypt-android:2.5.2'

    //epub
    implementation('com.positiondev.epublib:epublib-core:3.1') {
        exclude group: 'org.slf4j'
        exclude group: 'xmlpull'
    }

}

greendao {
    schemaVersion 65
    daoPackage 'com.kunfei.bookshelf.dao'
    targetGenDir 'src/main/java'
}

// google-services / crashlytics 插件已移除
// （原版依赖 google-services.json 与 RELEASE_STORE_FILE，两者仓库内均缺失，会直接阻断构建）
